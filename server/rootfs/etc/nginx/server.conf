include domain.conf;

root /var/www;
index index.php index.htm index.html;

# The browser client lives under /game/, whose index.html is the page. A
# request for /game is redirected to /game/ by nginx's own directory handling,
# so /game is all a player has to type. The client is static, all of it.
#
# These are the two headers that make the page cross-origin isolated. Without
# them the browser withholds SharedArrayBuffer, and the client's workers use
# `Atomics.wait` to block while a script waits for input, so nothing runs.
#
# They go on everything the client ships, not just the page. A dedicated
# worker inherits the document's embedder policy and the browser refuses a
# worker script whose own response does not repeat it -- and WebKit applies
# that to the whole module graph, so every script worker.js statically imports
# (control.js, fonts.js, storage.js, pkg/dso_web.js) needs the header too.
# Without it the worker never starts and all four consoles stay dead, which is
# why the client did not run on iOS at all: WebKit is the only engine there.
# Chromium and Firefox enforce the rule on the top-level worker script alone,
# so neither showed it. The header is inert on a response that is neither a
# document nor a worker script, which is what most of these are.
#
# `add_header` replaces the inherited set rather than adding to it, hence the
# include.
location /game/ {
    include headers.conf;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Every asset here is named for the hash of what is in it -- `build.sh`
    # stamps them, see `web/stamp.ts` -- so a URL under this prefix means one
    # file of one build and can never come to mean anything else. Hence
    # `immutable`: never revalidate, and a name left over from a build that is
    # gone is a 404 rather than something quietly wrong.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# The page, which is the one name that has to stay put: it is what a player
# types, and it is how every stamped name is reached. So it is the one
# response a browser has to ask about again.
#
# It has to be asked about, too. These files are served out of the nix store,
# where every mtime is the epoch, so `Last-Modified` is a date in 1970 and
# nginx's ETag is that mtime and the size. A response saying nothing about
# caching is guessed to stay fresh for a tenth of the age it reads there, and
# a tenth of fifty-six years is five of them -- which is how a deploy once
# left a browser running the previous build's wasm module underneath the new
# `pkg/dso_web.js`, the one file it had thought to ask about.
#
# Matching the file rather than the directory catches both ways in: `index`
# turns a request for `/game/` into one for `/game/index.html`, and that
# internal redirect picks a location again.
location = /game/index.html {
    include headers.conf;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-cache" always;

    # And it has to be asked about with nothing to answer "no change" with.
    #
    # `no-cache` above means revalidate, not refetch, so the browser asks
    # with whatever validator it was given -- and both of nginx's are
    # useless here. It builds an ETag out of the file's mtime and size, and
    # these files come out of the nix store where every mtime is 1, so the
    # ETag is the size alone. The size of this file does not change when a
    # deploy changes what it points at: `stamp.ts` writes a digest of fixed
    # width, so `style.<12 hex>.css` becomes `style.<12 hex>.css` and the
    # page stays exactly as many bytes as it was.
    #
    # So the browser asks, nginx says 304, and the page it keeps names the
    # previous build's assets -- which are `immutable`, and answered from
    # cache for a year. The whole deploy goes unseen by anyone who had ever
    # loaded the page before it, and the cure is a hard reload nobody knows
    # to do. Turning both validators off is what makes `no-cache` mean what
    # it is here for: this one response, always fetched.
    etag off;
    if_modified_since off;
}

location ~ ^/(api/)?[a-z0-9_]+\.php$ {
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_pass unix:/run/php-fpm.sock;
}

location = /readyz {
    add_header Content-Type text/plain always;
    return 200 "OK";
}
