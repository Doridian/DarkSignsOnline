include domain.conf;

root /var/www;
index index.php index.htm index.html;

# The browser client is /game.php, which the location below serves like any
# other page here: it sends the two headers that make it cross-origin
# isolated itself, so nothing needs saying about it in this file.
location ~ ^/(api/)?[a-z0-9_]+\.php$ {
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_pass unix:/run/php-fpm.sock;
}

location = /readyz {
    add_header Content-Type text/plain always;
    return 200 "OK";
}
