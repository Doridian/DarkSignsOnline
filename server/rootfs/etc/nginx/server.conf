include domain.conf;

root /var/www;
index index.php index.htm index.html;

# The browser client is /game.php, which the location below serves like any
# other page here: it sends for itself the two headers that make it
# cross-origin isolated.
#
# Its worker is the one thing the page cannot speak for. A dedicated worker
# inherits the document's embedder policy, and the browser refuses the worker
# script unless its own response repeats that policy -- Firefox fails it as
# NS_ERROR_BLOCKED_BY_POLICY. worker.js is a static file, so nginx is what
# has to say it. `add_header` replaces the inherited set rather than adding
# to it, hence the include.
location = /worker.js {
    include headers.conf;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
}

location ~ ^/(api/)?[a-z0-9_]+\.php$ {
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_pass unix:/run/php-fpm.sock;
}

location = /readyz {
    add_header Content-Type text/plain always;
    return 200 "OK";
}
