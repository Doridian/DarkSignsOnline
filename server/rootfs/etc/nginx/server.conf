include domain.conf;

root /var/www;
index index.php index.htm index.html;

# The browser client. A static page under a .php name, for consistency with
# forgot_password.php and the rest of the site; there is no PHP in it.
#
# The two headers are what make the page cross-origin isolated, and without
# that there is no SharedArrayBuffer and the client's workers cannot block
# waiting for input. add_header does not merge -- a location that sets one of
# its own discards every header inherited from the server -- so the site's
# headers are repeated here.
location = /game.php {
    include headers.conf;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    default_type text/html;
}

location ~ ^/(api/)?[a-z0-9_]+\.php$ {
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_pass unix:/run/php-fpm.sock;
}

location = /readyz {
    add_header Content-Type text/plain always;
    return 200 "OK";
}
