on:
  pull_request: {}
  workflow_call: {}

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

name: Build server

permissions:
  contents: read

jobs:
  server:
    name: Build server
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31

    - name: Clippy
      run: >
        nix develop .#server --command
        cargo clippy --manifest-path server/Cargo.toml --all-targets
        -- -D warnings

    # Including the parity test: every case in tests/parity run against a
    # real MariaDB, and compared with the goldens the PHP
    # server it replaced recorded.
    - name: Test
      run: >
        nix develop .#server --command
        cargo test --manifest-path server/Cargo.toml -- --include-ignored

    - name: Build
      run: nix build --print-build-logs .#darksignsonline-server
