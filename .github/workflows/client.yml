on:
  pull_request: {}
  workflow_call: {}

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

name: Build client

permissions:
  contents: read

jobs:
  client:
    name: Build client
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31

    # Through the dev shell, so the rustc and clippy answered to here are the
    # ones flake.lock pins and the ones `nix build` uses.
    - name: Clippy
      run: >
        nix develop --command
        cargo clippy --manifest-path client/Cargo.toml --workspace --all-targets
        -- -D warnings
    - name: Test
      run: >
        nix develop --command
        cargo test --manifest-path client/Cargo.toml --workspace

    # The wasm module, the shipped script bundle and the page. Its check phase
    # type-checks all three TypeScript projects and runs the page's own tests.
    - name: Build
      run: nix build --print-build-logs .#darksignsonline-client
