<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dark Signs Online</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="titlebar">
      <span id="brand">Dark Signs Online</span>
      <span id="status-dot" class="offline" aria-hidden="true"></span>
      <span id="status-text">Not signed in.</span>

      <!--
        The account. Signed in it is a name and a way out; signed out it is a
        button holding the form, so the sign-in fields do not sit across the
        bar for the whole of a session that is already authorized.
      -->
      <div id="account">
        <span id="account-label" hidden>Logged in as <b id="account-user"></b></span>
        <button id="logout" type="button" hidden>Log out</button>

        <button id="account-toggle" type="button" aria-haspopup="true"
                aria-expanded="false" aria-controls="account-menu">
          <span class="hamburger" aria-hidden="true"></span>
          Sign in
        </button>

        <div id="account-menu" hidden>
          <form id="login" autocomplete="on">
            <input id="username" type="text" placeholder="username" autocomplete="username"
                   aria-label="Username" />
            <input id="password" type="password" placeholder="password"
                   autocomplete="current-password" aria-label="Password" />
            <label id="remember-label"
                   title="Keeps your username and password in this browser, unencrypted, so the next visit signs in by itself.">
              <input id="remember" type="checkbox" />
              Remember me
            </label>
            <button type="submit">Sign in</button>
          </form>

          <!--
            The site's own pages, which are where an account is made and a
            password recovered. Root-relative because the client is served
            from `/game/` on that same site; a new tab because leaving this
            one throws four consoles away.
          -->
          <nav id="account-links" aria-label="Account">
            <a href="/create_account.php" target="_blank" rel="noopener">Create an account</a>
            <a href="/forgot_password.php" target="_blank" rel="noopener">Forgot your password?</a>
          </nav>
        </div>
      </div>
    </header>

    <!-- The communications log: server and client notices, newest last. -->
    <section id="comm" role="log" aria-label="Communications" aria-live="polite"></section>

    <!--
      The four consoles, stacked with only the active one shown. Each keeps
      its own log, prompt and input, because each has a worker of its own and
      one blocked on `ReadLine` must not stop the others.
    -->
    <main id="consoles"></main>

    <!--
      Script output, with the prompt as its last line. The entry lives inside
      the scrolling log rather than under it so that typing happens where the
      text ends, the way a terminal behaves.
    -->
    <template id="console-template">
      <section class="console" role="log" aria-live="polite">
        <div class="line no-prespace entry idle">
          <span class="prompt">/&gt;</span>
          <input class="input" type="text" autocomplete="off" autocapitalize="off"
                 spellcheck="false" disabled />
        </div>
      </section>
    </template>

    <!--
      The sub-windows. Each is filled in by its own module and each is
      dragged by its title bar, since a modal dialog covers the console it
      was opened from.
    -->
    <!-- DSMail, opened by the console's `mail` command. -->
    <dialog id="mail" aria-label="DSO Mail"></dialog>
    <!-- The editor, opened by `EDIT <file>`. -->
    <dialog id="editor" aria-label="Editor"></dialog>
    <!-- The file library and the text space, opened from the status bar. -->
    <dialog id="library" aria-label="File Library"></dialog>

    <footer id="statusbar">
      <span id="hint">Type <b>HELP</b> for a list of commands.</span>
      <button id="open-library" type="button">File Library</button>
      <!-- Filled in by the page, one per console, with F1-F4 as shortcuts. -->
      <nav id="tabs" role="tablist" aria-label="Consoles"></nav>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
