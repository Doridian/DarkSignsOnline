<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dark Signs Online</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="titlebar">
      <span id="brand">Dark Signs Online</span>
      <span id="status-dot" class="offline" aria-hidden="true"></span>
      <span id="status-text">Not signed in.</span>

      <!--
        The account. Signed in it is a name and a way out; signed out it is a
        button holding the form, so the sign-in fields do not sit across the
        bar for the whole of a session that is already authorized.
      -->
      <div id="account">
        <span id="account-label" hidden>Logged in as <b id="account-user"></b></span>
        <button id="logout" type="button" hidden>Log out</button>

        <button id="account-toggle" type="button" aria-haspopup="true"
                aria-expanded="false" aria-controls="account-menu">
          <span class="hamburger" aria-hidden="true"></span>
          Sign in
        </button>

        <div id="account-menu" hidden>
          <form id="login" autocomplete="on">
            <input id="username" type="text" placeholder="username" autocomplete="username"
                   aria-label="Username" />
            <input id="password" type="password" placeholder="password"
                   autocomplete="current-password" aria-label="Password" />
            <label id="remember-label"
                   title="Keeps your username and password in this browser, unencrypted, so the next visit signs in by itself.">
              <input id="remember" type="checkbox" />
              Remember me
            </label>
            <button type="submit">Sign in</button>
          </form>

          <!--
            The site's own pages, which are where an account is made and a
            password recovered. Root-relative because the client is served
            from `/game/` on that same site; a new tab because leaving this
            one throws four consoles away.
          -->
          <nav id="account-links" aria-label="Account">
            <a href="/create_account.php" target="_blank" rel="noopener">Create an account</a>
            <a href="/forgot_password.php" target="_blank" rel="noopener">Forgot your password?</a>
          </nav>
        </div>
      </div>
    </header>


    <!--
      The consoles, which are the one thing that is not a window: they are
      the desktop everything else floats over. Four of them, stacked with
      only the active one shown, because each has a worker of its own and one
      blocked on `ReadLine` must not stop the others.
    -->
    <main id="consoles"></main>

    <!--
      Script output, with the prompt as its last line. The entry lives inside
      the scrolling log rather than under it so that typing happens where the
      text ends, the way a terminal behaves.
    -->
    <template id="console-template">
      <section class="console" role="log" aria-live="polite">
        <div class="line no-prespace entry idle">
          <span class="prompt">/&gt;</span>
          <input class="input" type="text" autocomplete="off" autocapitalize="off"
                 spellcheck="false" disabled />
        </div>
      </section>
    </template>

    <!--
      The windows. Every one of them floats over the consoles, is dragged by
      its title bar and is resized by its frame; several can be open at once,
      which is why none of them is modal. `window.ts` owns where they sit and
      which is in front.
    -->

    <!-- The communications log: server and client notices, newest last. -->
    <section id="comm" class="window" aria-label="Communications">
      <header class="win-bar win-drag">
        <strong class="win-title">Communications</strong>
        <span class="win-spacer"></span>
        <button class="win-close" type="button">Close</button>
      </header>
      <div id="comm-log" class="comm-body" role="log" aria-live="polite"></div>
    </section>

    <!--
      The file explorer: folders on the left, the chosen folder's files on
      the right as icons, the way a file manager is.
    -->
    <aside id="filetree" class="window" hidden aria-label="Files">
      <header class="win-bar win-drag">
        <strong class="win-title">Files</strong>
        <span class="tree-path" aria-live="polite">/</span>
        <span class="win-spacer"></span>
        <button class="win-close tree-hide" type="button" title="Close (Files)">Close</button>
      </header>
      <!--
        Both panes are filled in by `filetree.ts`, and redrawn whenever any
        of the four consoles writes, deletes, makes or removes anything.
      -->
      <div class="tree-panes">
        <div class="tree-body" role="tree" aria-label="Folders"></div>
        <div class="tree-split" role="separator" aria-orientation="vertical"
             aria-label="Resize the folder list"></div>
        <div class="tree-icons" role="listbox" aria-label="Files" tabindex="0"></div>
      </div>
      <p class="tree-status" role="status"></p>
    </aside>

    <!--
      Chat. The original raises its ChatBox over the console with F5, and
      this does the same -- except that it is a window, so it can be pushed
      aside rather than closed.
    -->
    <section id="chat" class="window" hidden aria-label="Chat">
      <header class="win-bar chat-bar win-drag">
        <strong class="win-title chat-title">Chat</strong>
        <span class="win-spacer"></span>
        <button class="win-close chat-close" type="button" title="Close (F5)">Close</button>
      </header>
      <div class="chat-log" role="log" aria-live="polite"></div>
      <form class="chat-entry" autocomplete="off">
        <input class="chat-input" type="text" aria-label="Message"
               placeholder="Say something, or /me does something"
               autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button class="chat-send" type="submit">Chat</button>
      </form>
    </section>

    <!--
      The two that fill themselves in. Each is still a `<dialog>` -- for
      `open`, `close()` and the `close` event -- but shown rather than
      modal, so the rest of the desktop stays live behind it. The editors are
      dialogs too, and are not here: `EDIT` makes one per file it opens.
    -->
    <!-- DSMail, opened by the console's `mail` command. -->
    <dialog id="mail" class="window" aria-label="DSO Mail"></dialog>
    <!-- The file library and the text space, opened from the status bar. -->
    <dialog id="library" class="window" aria-label="File Library"></dialog>

    <footer id="statusbar">
      <span id="hint">Type <b>HELP</b> for a list of commands.</span>
      <button id="open-files" type="button" title="Show or hide the file explorer"
              aria-controls="filetree">Files</button>
      <button id="open-comm" type="button" title="Show or hide the communications log"
              aria-controls="comm">Comms</button>
      <button id="open-chat" type="button" title="Chat (F5)">Chat</button>
      <button id="open-library" type="button">File Library</button>
      <!-- Filled in by the page, one per console, with F1-F4 as shortcuts. -->
      <nav id="tabs" role="tablist" aria-label="Consoles"></nav>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
