<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dark Signs Online</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="titlebar">
      <span id="status-dot" class="offline" aria-hidden="true"></span>
      <span id="status-text">Not signed in.</span>

      <form id="login" autocomplete="on">
        <input id="username" type="text" placeholder="username" autocomplete="username"
               aria-label="Username" />
        <input id="password" type="password" placeholder="password"
               autocomplete="current-password" aria-label="Password" />
        <label id="remember-label"
               title="Keeps your username and password in this browser, unencrypted, so the next visit signs in by itself.">
          <input id="remember" type="checkbox" />
          Remember me
        </label>
        <button type="submit">Sign in</button>
      </form>
    </header>

    <!-- The communications log: server and client notices, newest last. -->
    <section id="comm" role="log" aria-label="Communications" aria-live="polite"></section>

    <!--
      Script output, with the prompt as its last line. The entry lives inside
      the scrolling log rather than under it so that typing happens where the
      text ends, the way a terminal behaves.
    -->
    <main id="output" role="log" aria-label="Console" aria-live="polite">
      <div id="entry" class="line no-prespace idle">
        <span id="prompt">/&gt;</span>
        <input id="input" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" disabled aria-label="Console input" />
      </div>
    </main>

    <footer id="statusbar">
      <span id="hint">Type <b>HELP</b> for a list of commands.</span>
      <nav id="tabs" aria-label="Consoles">
        <button class="tab active" data-console="1">1</button>
        <button class="tab" data-console="2">2</button>
        <button class="tab" data-console="3">3</button>
        <button class="tab" data-console="4">4</button>
      </nav>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
