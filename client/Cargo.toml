[workspace]
members = ["web"]

[package]
name = "dso-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "vbscript"
path = "src/lib.rs"

[[bin]]
name = "dso-client"
path = "src/main.rs"

[dependencies]
aes = "0.9.3"
aes-gcm = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4"
regex = "1"
sha2 = "0.11.0"
ureq = { version = "3.4.0", optional = true }
zstd = "0.14.0"

# In a browser the randomness behind AES-GCM comes from the Web Crypto API,
# which getrandom only reaches when this feature is on.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.test]
opt-level = 1

[features]
default = ["native-http"]
# A blocking HTTP client for the desktop build. A browser build turns this
# off and reaches the server through fetch instead.
native-http = ["dep:ureq"]
