[package]
name = "dso-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "vbscript"
path = "src/lib.rs"

[[bin]]
name = "dso-client"
path = "src/main.rs"

[dependencies]
aes = "0.9.3"
aes-gcm = "0.11.1"
base64 = "0.23.1"
regex = "1"
sha2 = "0.11.0"
ureq = { version = "3.4.0", optional = true }
zstd = "0.14.0"

[profile.test]
opt-level = 1

[features]
default = ["native-http"]
# A blocking HTTP client for the desktop build. A browser build turns this
# off and reaches the server through fetch instead.
native-http = ["dep:ureq"]
